<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מבחני תרגול אינטראקטיביים — מורי דרך</title>
<style>
  :root {
    --teal: #0F6E56;
    --teal-light: #E1F5EE;
    --teal-mid: #5DCAA5;
    --red: #A32D2D;
    --red-light: #FCEBEB;
    --amber: #854F0B;
    --amber-light: #FAEEDA;
    --ink: #2C2C2A;
    --sub: #5F5E5A;
    --border: #D3D1C7;
    --bg: #FAF9F6;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    padding: 0 0 60px;
    line-height: 1.6;
  }
  header {
    background: var(--teal);
    color: white;
    padding: 18px 24px;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  header h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
  header .sub { font-size: 13px; opacity: 0.9; }
  #scorebar {
    display: none;
    margin-top: 10px;
    font-size: 15px;
    font-weight: 600;
    background: rgba(255,255,255,0.15);
    border-radius: 8px;
    padding: 8px 14px;
  }
  main { max-width: 780px; margin: 0 auto; padding: 24px 16px; }
  .select-screen { text-align: center; padding: 40px 16px; }
  .select-screen h2 { font-size: 22px; margin-bottom: 24px; }
  .exam-btn {
    display: block;
    width: 100%;
    max-width: 420px;
    margin: 0 auto 16px;
    padding: 18px;
    font-size: 17px;
    font-weight: 600;
    background: white;
    border: 2px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    color: var(--ink);
    transition: all 0.15s;
  }
  .exam-btn:hover { border-color: var(--teal); background: var(--teal-light); }
  .section-title {
    font-size: 19px;
    font-weight: 600;
    margin: 32px 0 14px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--teal);
    color: var(--teal);
  }
  .qcard {
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .qtopic {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    color: var(--teal);
    background: var(--teal-light);
    border-radius: 6px;
    padding: 2px 9px;
    margin-bottom: 8px;
  }
  .qtext { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
  .opt {
    display: block;
    width: 100%;
    text-align: right;
    padding: 11px 14px;
    margin-bottom: 8px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: white;
    font-size: 15px;
    cursor: pointer;
    color: var(--ink);
    transition: all 0.12s;
  }
  .opt:hover:not(.locked) { border-color: var(--teal); background: var(--teal-light); }
  .opt.correct { background: var(--teal-light); border-color: var(--teal); color: var(--teal); font-weight: 600; }
  .opt.incorrect { background: var(--red-light); border-color: var(--red); color: var(--red); font-weight: 600; }
  .opt.locked { cursor: default; }
  .explain {
    margin-top: 10px;
    font-size: 13.5px;
    color: var(--sub);
    background: #F5F4F0;
    border-radius: 8px;
    padding: 10px 12px;
    display: none;
  }
  textarea {
    width: 100%;
    min-height: 90px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 14.5px;
    resize: vertical;
    margin-bottom: 10px;
  }
  .reveal-btn, .finish-btn, .restart-btn {
    background: var(--teal);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .reveal-btn:hover, .finish-btn:hover, .restart-btn:hover { background: #0c5744; }
  .model-answer {
    display: none;
    margin-top: 12px;
    background: var(--amber-light);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 14.5px;
    color: var(--amber);
  }
  .rate-row { display: none; margin-top: 12px; gap: 8px; flex-wrap: wrap; }
  .rate-btn {
    padding: 8px 14px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: white;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 600;
    margin-left: 8px;
  }
  .rate-btn.active-2 { background: var(--teal-light); border-color: var(--teal); color: var(--teal); }
  .rate-btn.active-1 { background: var(--amber-light); border-color: var(--amber); color: var(--amber); }
  .rate-btn.active-0 { background: var(--red-light); border-color: var(--red); color: var(--red); }
  .finish-wrap { text-align: center; margin: 32px 0; }
  .results-box {
    background: white;
    border: 2px solid var(--teal);
    border-radius: 14px;
    padding: 28px 24px;
    text-align: center;
    margin-bottom: 24px;
  }
  .results-box .big-score { font-size: 42px; font-weight: 700; color: var(--teal); margin: 8px 0; }
  .results-box .pct { font-size: 17px; color: var(--sub); margin-bottom: 4px; }
  .breakdown { text-align: right; margin-top: 20px; }
  .breakdown-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 4px;
    border-bottom: 1px solid var(--border);
    font-size: 14.5px;
  }
  .hidden { display: none !important; }
  .backlink { display: inline-block; margin-top: 18px; color: var(--teal); cursor: pointer; font-size: 14px; text-decoration: underline; }
  .fill-input {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 14.5px;
    margin-bottom: 10px;
    font-family: inherit;
  }
  .section-sub { text-align: center; font-size: 13.5px; color: var(--sub); margin: -14px 0 24px; }
</style>
</head>
<body>

<header>
  <h1>מבחני תרגול אינטראקטיביים — קורס מורי דרך</h1>
  <div class="sub">כל שאלה שווה 2 נקודות. לחצו על תשובה כדי לבדוק אותה מיד.</div>
  <div id="scorebar"></div>
</header>

<main id="app"></main>

<script>

      { topic: "גבולות ותקופות", q: "הגבול ההלכתי ('ארץ ישראל הקדושה') עוסק ב:", options: ["גבולות מנהליים של האימפריה הרומית", "תחומים גאוגרפיים שבהם חלות מצוות התלויות בארץ", "הגבול המקראי הרחב מנהר מצרים ועד פרת", "חלוקת הארץ לסנג'אקים עות'מאניים"], correct: 1, exp: "נוסח ב'ברייתא דתחומין' ובכתובת רחוב — מגדיר היכן חלות מצוות כמו שמיטה." },
      { topic: "חי", q: "הציפור הנחשבת לציפור הלאומית של ישראל היא:", options: ["הדוכיפת", "הנשר", "הדאה שחורת-הכתף", "הכטופה"], correct: 0, exp: "הדוכיפת נבחרה כציפור הלאומית של ישראל." },

      { type: "mc", topic: "התקופה הרומית – מיבנה עד מרד בר כוכבא", q: "מה היה תפקידו של אספסיאנוס כשהגיע לארץ ישראל בשנת 67 לספירה?", options: ["נציב יהודה שמונה במקום גסיוס פלורוס", "מצביא ששלח נירון לדכא את המרד הגדול", "מושל סוריה שדיכא את מרד וארוס", "קיסר שבא לחנוך את איליה קפיטולינה"], correct: 1, exp: "אספסיאנוס כבש את הגליל (יודפת, גמלא), ובשנת 69 עלה לשלטון ברומא ויסד את השושלת הפלבית. את המצור על ירושלים השלים בנו טיטוס." },
      { type: "fill", topic: "התקופה הרומית – מיבנה עד מרד בר כוכבא", q: "החכם שקיבל לפי המסורת מאספסיאנוס את 'יבנה וחכמיה': ___________________________", answer: "יוחנן בן זכאי", exp: "רבן יוחנן בן זכאי נמלט מירושלים הנצורה. ביבנה נבנתה מחדש ההנהגה, והותאמו ההלכה והתפילה למציאות של דת ללא מקדש." },
      { type: "mc", topic: "התקופה הרומית – מיבנה עד מרד בר כוכבא", q: "מהו 'מרד התפוצות'?", options: ["מרד יהודי הגליל בימי הקיסר קונסטנטיוס", "מרד יהודי יהודה בימי אדריאנוס", "מרד יהודי בבל נגד השלטון הפרסי", "מרד יהודי מצרים, קירנאיקה וקפריסין בימי טריאנוס"], correct: 3, exp: "115–117 לספירה, גם במסופוטמיה. דוכא בידי לוסיוס קיטוס, ובפי חז״ל 'פולמוס של קיטוס'. מרד בימי אדריאנוס הוא מרד בר כוכבא; מרד בימי קונסטנטיוס הוא מרד גאלוס." },
      { type: "mc", topic: "התקופה הרומית – מיבנה עד מרד בר כוכבא", q: "היכן היה מעוזו האחרון של בר כוכבא, שנפל בשנת 135?", options: ["הרודיון", "ביתר", "יודפת", "מצדה"], correct: 1, exp: "ביתר מזוהה ליד הכפר בתיר, דרומית־מערבית לירושלים. נפילתה נמנית בין חמשת האסונות של תשעה באב. מצדה היא סוף המרד הגדול (73)." },
      { type: "mc", topic: "התקופה הרומית – מיבנה עד מרד בר כוכבא", q: "מה נמצא במערת האגרות בנחל חבר?", options: ["מכתבי בר כוכבא וארכיון בבתא", "מטבעות המרד הגדול ושלדי מגיני מצדה", "מכתבי המצור על לכיש לפני החורבן", "מגילות כת היחד ומגילת ישעיהו"], correct: 0, exp: "משלחתו של יגאל ידין (1960–61) מצאה אגרות של שמעון בר כוסבה אל מפקדיו בעין גדי, וארכיון פרטי של בבתא. מגילות כת היחד הן מקומראן." },
      { type: "mc", topic: "התקופה הרומית – מיבנה עד מרד בר כוכבא", q: "מה היה שמה הרומי של ירושלים לאחר מרד בר כוכבא?", options: ["דיוקיסריה", "סקיתופוליס", "איליה קפיטולינה", "ניקופוליס"], correct: 2, exp: "איליה על שם איליוס אדריאנוס, קפיטולינה על שם האלים הקפיטוליניים. דיוקיסריה היא ציפורי, ניקופוליס היא אמאוס, סקיתופוליס היא בית שאן." },
      { type: "mc", topic: "התקופה הרומית – הסנהדרין, המשנה והמנהל", q: "מהי ברכת המינים?", options: ["ברכה שתיקן עזרא הסופר עם אנשי הכנסת הגדולה", "ברכה שנוספה לתפילת העמידה ביבנה נגד פורשים ומלשינים", "ברכת הכהנים שנאמרה בעזרה עד חורבן המקדש", "ברכה שנאמרת על מאכלים משבעת המינים של הארץ"], correct: 1, exp: "שמואל הקטן ניסח אותה ביבנה בימי רבן גמליאל, והיא הברכה ה־19 בשמונה עשרה. היא כוונה גם נגד יהודים־נוצרים, ושימשה להרחקתם מהובלת התפילה." },
      { type: "mc", topic: "התקופה הרומית – הסנהדרין, המשנה והמנהל", q: "היכן חנה הלגיון העשירי (פרטנסיס) מיד לאחר החורבן ב־70?", options: ["בלגיו, ליד מגידו", "בקיסריה", "בבית שאן", "בירושלים"], correct: 3, exp: "הלגיון העשירי ישב על חורבות ירושלים; מפעל הרעפים שלו נמצא בבנייני האומה. בלגיו חנה הלגיון השישי (פרטה), וקיסריה הייתה מושב הנציב." },
      { type: "fill", topic: "התקופה הרומית – הסנהדרין, המשנה והמנהל", q: "העיר שבה חתם רבי יהודה הנשיא את המשנה, בסביבות שנת 200: ___________________________", answer: "ציפורי", exp: "רבי יהודה הנשיא העביר את הסנהדרין מבית שערים לציפורי, ושם ערך את המשנה. נקבר בבית שערים. אין תאריך מדויק — 200 או 220 לספירה, שניהם מקובלים." },
      { type: "mc", topic: "התקופה הרומית – הסנהדרין, המשנה והמנהל", q: "מהי התחנה האחרונה בנדודי הסנהדרין לפי מסורת חז\"ל?", options: ["בית שערים", "ציפורי", "אושא", "טבריה"], correct: 3, exp: "הסדר: ירושלים ← יבנה ← אושא ← שפרעם ← בית שערים ← ציפורי ← טבריה. מדרום־מערב לצפון־מזרח, כי מרכז החיים היהודי עבר מיהודה לגליל." },
      { type: "mc", topic: "התקופה הרומית – הסנהדרין, המשנה והמנהל", q: "מה היו 'משמרות הכהונה', שזכרן נשמר בגליל לאחר החורבן?", options: ["חבורות כהנים ששמרו על גנזי המקדש בבבל", "שומרי הלילה של שערי הר הבית", "24 קבוצות כהנים שעבדו במקדש בתורנות", "24 מצודות שהקימו הכהנים לאורך גבול הגליל"], correct: 2, exp: "לאחר החורבן התיישבו המשמרות ביישובי הגליל, ורשימות שלהן נחקקו בבתי כנסת (שבר כזה נמצא בקיסריה) — זיכרון המקדש ותקווה לחידושו." },
      { type: "fill", topic: "התקופה הביזנטית – התנצרות האימפריה", q: "הקרב שבו ניצח קונסטנטינוס את מקסנטיוס בשנת 312, לאחר שראה חזון בשמיים: קרב ___________________________", answer: "גשר מולוויאן", exp: "על נהר הטיבר ברומא. בחזון ראה את צירוף האותיות חי ורו ושמע 'בסימן זה תנצח'. בעקבות הניצחון אימץ יחס חיובי לנצרות, אך הוטבל רק על ערש דווי ב־337." },
      { type: "mc", topic: "התקופה הביזנטית – התנצרות האימפריה", q: "מה קבע צו מילאנו בשנת 313?", options: ["נאסר פולחן האלים הפגניים", "הנצרות הוכרזה כדת המדינה היחידה", "הנצרות הוכרה כדת מותרת באימפריה", "ירושלים הוכרזה כפטריארכיה"], correct: 2, exp: "ב־313 הנצרות היא Religio Licita, דת מותרת. דת המדינה היא רק ב־380, בימי תאודוסיוס הראשון. ירושלים הוכרזה כפטריארכיה במאה ה־5." },
      { type: "mc", topic: "התקופה הביזנטית – התנצרות האימפריה", q: "מי היה 'יוליאנוס הכופר', ומה ניסה לעשות בירושלים?", options: ["קיסר נוצרי שגירש את היהודים מירושלים והרס בתי כנסת", "קיסר שניסה להחזיר את הפגניות ויזם את בניין המקדש מחדש", "מנהיג שומרוני שמרד ותפס את שכם וקיסריה", "בישוף ירושלים שהתנגד להחלטות ועידת ניקיאה"], correct: 1, exp: "יוליאנוס (361–363) ראה ביהודים בני ברית נגד הנצרות. היוזמה נפסקה עם מותו במלחמה בפרסים ב־363. אל תבלבלו עם יוליאנוס בן סבר, מנהיג מרד השומרונים ב־529." },
      { type: "mc", topic: "התקופה הביזנטית – התנצרות האימפריה", q: "מה הייתה בירת פלאיסטינה סקונדה, לפי החלוקה המנהלית של סוף המאה ה־4?", options: ["חלוצה", "בית שאן (סקיתופוליס)", "קיסריה", "ציפורי (דיוקיסריה)"], correct: 1, exp: "פלאיסטינה פרימה — מרכז הארץ, בירתה קיסריה; סקונדה — הגליל והעמקים, בירתה בית שאן; טרטיה — הדרום." },
      { type: "fill", topic: "התקופה הביזנטית – כנסיות, צליינות ובתי כנסת", q: "החיבור הגאוגרפי של בישוף קיסריה במאה ה־4, המזהה את המקומות המקראיים בארץ ומפרט את המרחקים ביניהם: ___________________________", answer: "האונומסטיקון", exp: "אאוזביוס מקיסריה חיבר אותו. הוא משמש עד היום לזיהוי אתרים, ומפת מידבא נשענה עליו במידה רבה." },
      { type: "mc", topic: "התקופה הביזנטית – כנסיות, צליינות ובתי כנסת", q: "מה מתארת מפת מידבא?", options: ["את דרכי האימפריה הרומית על גבי מגילת קלף", "את גבולות פרובינציה ערביה שסיפח טריאנוס", "את ארץ ישראל בפסיפס, וירושלים הביזנטית במרכזה", "את מסלולו של הצליין מבורדו לירושלים"], correct: 2, exp: "רצפת פסיפס בכנסייה במידבא שבעבר הירדן, מן המאה ה־6, ומזרח בראשה. מגילת הדרכים היא מפת פויטינגר — מסמך אחר לגמרי." },
      { type: "mc", topic: "התקופה הביזנטית – כנסיות, צליינות ובתי כנסת", q: "מי בנה את כנסיית הניאה בירושלים?", options: ["הרקליוס", "הקיסרית אבדוקיה", "יוסטיניאנוס", "קונסטנטינוס הגדול"], correct: 2, exp: "הניאה ('החדשה'), שהוקדשה למרים, נחנכה ב־543. שרידיה וכתובת ההקדשה נמצאו בשולי הרובע היהודי, ליד החומה הדרומית. קונסטנטינוס בנה את כנסיית הקבר." },
      { type: "mc", topic: "התקופה הביזנטית – כנסיות, צליינות ובתי כנסת", q: "איזו סצנה מקראית מופיעה ברצפת הפסיפס של בית הכנסת בבית אלפא?", options: ["חציית ים סוף", "דניאל בגוב האריות", "תיבת נח", "עקדת יצחק"], correct: 3, exp: "בבית אלפא (המאה ה־6) העקדה מופיעה לצד גלגל המזלות ותשמישי קדושה. דניאל מופיע בנערן; חציית ים סוף בדורה אירופוס שבסוריה." },
      { type: "mc", topic: "התקופה הביזנטית – כנסיות, צליינות ובתי כנסת", q: "מהי חשיבותה של הצליינית אגריה (איתריה) מהמאה ה־4?", options: ["תיארה ביומן מסע את הטקסים והמנהגים בירושלים", "בנתה את כנסיית סטפנוס מצפון לשער שכם", "גילתה לפי המסורת את הצלב האמיתי", "הקימה את המנזר הראשון במדבר יהודה"], correct: 0, exp: "יומן אגריה (כ־381–384) הוא מקור מרכזי לליטורגיה של ירושלים הביזנטית. את כנסיית סטפנוס בנתה אבדוקיה; את הצלב מצאה, לפי המסורת, הלנה." },
      { type: "mc", topic: "התקופה הביזנטית – כנסיות, צליינות ובתי כנסת", q: "את מה מנציחה הכנסייה הביזנטית באלוני ממרא שליד חברון?", options: ["את לידתו של יוחנן המטביל", "את טבילת ישו במי הירדן", "את קבורת אברהם ושרה במערה", "את פגישת אברהם ושלושת המלאכים"], correct: 3, exp: "ממרא היא מפעלי הדור של קונסטנטינוס, לצד כנסיית הקבר, כנסיית המולד ואלאונה. בנצרות נקראה הפגישה עם שלושת המלאכים כרמז לשילוש. מערת המכפלה — מקום הקבורה." },
      { type: "fill", topic: "ארכיאולוגיה קלאסית – סדרים, מקדשים וערים", q: "בסדר הקורינתי מעוטרת הכותרת בעלים של צמח ה___________________________ (הקוציץ הסורי)", answer: "אקנתוס", exp: "הקורינתי הוא הצר והמעוטר מבין שלושת הסדרים. דוגמאות: המקדש בחורבת עומרית והמקדש לאוגוסטוס ולרומא בקיסריה." },
      { type: "mc", topic: "ארכיאולוגיה קלאסית – סדרים, מקדשים וערים", q: "מה מאפיין את העמוד בסדר הדורי?", options: ["כותרתו מעוטרת בשני שבלולים (וולוטות)", "ניצב על בסיס גבוה ודק במיוחד", "כותרתו מעוטרת בעלי אקנתוס", "יוצא ישירות מן הסטילובט, ללא בסיס"], correct: 3, exp: "הדורי הוא הפשוט והגוץ: בלי בסיס, כותרת חלקה. דוגמאות בירושלים: קבר יאסון ברחביה וקבר בני חזיר. שבלולים — יוני; אקנתוס — קורינתי." },

      { type: "mc", topic: "התקופה הרומית – מיבנה עד מרד בר כוכבא", q: "איזו גזירה של אדריאנוס הרעה את היחסים עם היהודים, לפי ההרצאה?", options: ["גיוס יהודים ללגיונות הרומיים", "איסור ברית המילה", "איסור עלייה לרגל לירושלים בחגים", "חובת הקרבה לפסל הקיסר במקדש"], correct: 1, exp: "לפי המרצה, האיסור לא נועד להתגרות ביהודים: הוא נבע מתפיסת אדריאנוס שאסור לפגוע באידיאל היופי של גוף האדם. היהודים הבינו אותו אחרת לגמרי." },
      { type: "mc", topic: "התקופה הרומית – מיבנה עד מרד בר כוכבא", q: "מה טען אאוזביוס בשאלת היחס בין מרד בר כוכבא להקמת איליה קפיטולינה?", options: ["שאדריאנוס ויתר על הקמת העיר בעקבות המרד", "שהעיר הוקמה עוד בימי טריאנוס, לפני אדריאנוס", "שהקמת העיר האלילית קדמה למרד וגרמה לו", "שהקמת העיר האלילית באה כעונש אחרי המרד"], correct: 3, exp: "ההיסטוריון הרומי דיו קסיוס טען שהעיר קדמה למרד וגרמה לו; אאוזביוס הנוצרי טען שהיא באה כעונש. הממצא — מטבעות איליה בידי המורדים וסלילת הקרדו המזרחי — נוטה לצד דיו." },
      { type: "fill", topic: "התקופה הרומית – מיבנה עד מרד בר כוכבא", q: "שמו המקורי של מנהיג המרד נגד אדריאנוס, כפי שהוא כתוב באגרותיו: שמעון בר ___________________________", answer: "כוסבה", exp: "'בר כוכבא' (על פי דרשת רבי עקיבא 'דרך כוכב מיעקב') ו'בר כוזיבא' הם שיבושים מכוונים מאוחרים. השם המקורי עולה מן האגרות שנמצאו במדבר יהודה." },
      { type: "mc", topic: "התקופה הרומית – מיבנה עד מרד בר כוכבא", q: "מה מופיע על מטבעות בר כוכבא?", options: ["חזית בית המקדש והכתובת 'לחירות ירושלים'", "דיוקן שמעון בר כוסבה והכתובת 'מלך המשיח'", "דמות הקיסר אדריאנוס והכתובת 'יהודה השבויה'", "קורות עץ ארז והכתובת 'שקל ישראל'"], correct: 0, exp: "המבנה בעל העמודים מזוהה עם המקדש — עדות לשאיפה לבנותו מחדש. אין עדות לכך שבר כוכבא כבש את ירושלים. 'יהודה השבויה' הוא מטבע ניצחון רומי מ־70." },
      { type: "mc", topic: "התקופה הרומית – מיבנה עד מרד בר כוכבא", q: "מהן מערכות המסתור שנחשפו בשפלת יהודה ובגליל?", options: ["מערות קבורה משפחתיות מימי הבית השני", "מחילות שהכינו המורדים לקראת מרד בר כוכבא", "מחילות שחפרו הרומאים במצור על ירושלים", "מנהרות שחצב הורדוס בין מבצרי המדבר"], correct: 1, exp: "מרד בר כוכבא היה מתוכנן, בניגוד למרד הגדול. מערכות המסתור בגליל לימדו שגם הגליל השתתף במרד — דבר שלא היה ידוע מן המקורות הכתובים." },
      { type: "mc", topic: "התקופה הרומית – הסנהדרין, המשנה והמנהל", q: "מי עמד בראש ההנהגה היהודית בציפורי בסביבות שנת 200, ומיוחסת לו ידידות עם קיסר בשם 'אנטונינוס'?", options: ["רבן יוחנן בן זכאי", "רבי עקיבא", "רבן גמליאל דיבנה", "רבי יהודה הנשיא"], correct: 3, exp: "בימיו הגיעה יוקרת בית הנשיא לשיאה. הסיפורים על אנטונינוס אגדתיים, אבל מבטאים יחסים טובים עם השלטון. אולי מדובר בקרקלה (211–217), אך כל קיסרי השושלת נקראו אנטונינוס." },
      { type: "mc", topic: "התקופה הרומית – הסנהדרין, המשנה והמנהל", q: "מהי 'ברייתא דתחומין'?", options: ["רשימת 24 משמרות הכהונה ומקומות מושבן בגליל", "כתובת פסיפס המפרטת את תחומי הארץ לעניין שמיטה ומעשרות", "כתובת הקדשה לבית כנסת מימי הבית השני", "מפת פסיפס של ארץ ישראל שירושלים במרכזה"], correct: 1, exp: "הכתובת הארוכה ברצפת בית הכנסת ברחוב שבעמק בית שאן מפרטת היכן חלים שמיטה ומעשרות. מפת הפסיפס היא מפת מידבא." },
      { type: "mc", topic: "התקופה הרומית – הסנהדרין, המשנה והמנהל", q: "מה אירע בתשעה באב לפי המשנה, נוסף על חורבן שני הבתים וחטא המרגלים?", options: ["נרצח גדליה בן אחיקם", "הובקעו חומות העיר", "נלכדה ביתר ונחרשה העיר", "נפלה מצדה ונשרף ההיכל"], correct: 2, exp: "חמשת האסונות של תשעה באב: גזירת המרגלים, חורבן הבית הראשון, חורבן השני, לכידת ביתר וחרישת העיר. רצח גדליה — ג' בתשרי; הבקעת החומות — י\"ז בתמוז." },
      { type: "mc", topic: "התקופה הרומית – הסנהדרין, המשנה והמנהל", q: "היכן חנה הלגיון השישי (פרטה) במאה ה־2 לספירה?", options: ["בלגיו, למרגלות תל מגידו", "בירושלים, על חורבות העיר העליונה", "בבוצרה, בירת פרובינציה ערביה", "באילה, לחוף מפרץ אילת"], correct: 0, exp: "המקום נקרא על שמו 'לגיו' (כפר עותנאי של חז״ל, אל־לג'ון בערבית). בירושלים חנה הלגיון העשירי, שהועבר לאילה בימי דיוקלטיאנוס." },
      { type: "fill", topic: "התקופה הרומית – הסנהדרין, המשנה והמנהל", q: "המקום בגליל התחתון שאליו עברה הסנהדרין מיבנה, אחרי גזרות אדריאנוס: ___________________________", answer: "אושא", exp: "יבנה ← אושא ← שפרעם ← בית שערים ← ציפורי ← טבריה. רבי יהודה בן בבא הסמיך חכמים בין אושא לשפרעם, בניגוד לגזרות." },
      { type: "mc", topic: "התקופה הרומית – הסנהדרין, המשנה והמנהל", q: "מהו מטבע 'יהודה השבויה' (Iudaea Capta)?", options: ["מטבע ניצחון שטבעו הקיסרים הפלביים אחרי החורבן", "מטבע שטבע אגריפס הראשון לכבוד הקיסר קליגולה", "מטבע שטבעו המורדים בשנה האחרונה למרד הגדול", "מטבע שטבע בר כוכבא לזכר חורבן הבית"], correct: 0, exp: "על המטבע: דמות אספסיאנוס, עץ תמר (סמל יהודה) ודמות אישה אבלה. אספסיאנוס ובניו טיטוס ודומיטיאנוס הם השושלת הפלבית (69–96)." },
      { type: "mc", topic: "התקופה הביזנטית – התנצרות האימפריה", q: "קונסטנטינופוליס, הבירה החדשה של קונסטנטינוס, הוקמה במקומה של העיר:", options: ["אנטיוכיה", "ביזנטיון", "ניקיאה", "אפסוס"], correct: 1, exp: "הבנייה הושלמה ב־330. כונתה 'נובה רומא', ובפי העם קונסטנטינופוליס. מן השם ביזנטיון גזרו חוקרים מודרניים את 'האימפריה הביזנטית'." },
      { type: "mc", topic: "התקופה הביזנטית – התנצרות האימפריה", q: "מה קרה לאימפריה הרומית עם מות תאודוסיוס הראשון בשנת 395?", options: ["בירתה הועברה לקונסטנטינופוליס", "היא פוצלה סופית למזרחית ולמערבית", "הנצרות הוכרזה בה כדת מותרת", "היא אוחדה מחדש תחת קיסר אחד"], correct: 1, exp: "מ־395, 'האימפריה הביזנטית' היא החלק המזרחי. המערב נפל לברברים פחות ממאה שנה אחר כך. דת מותרת — 313; הבירה — 330." },
      { type: "mc", topic: "התקופה הביזנטית – התנצרות האימפריה", q: "מי היה אוריגנס?", options: ["הצליין הראשון שכתב יומן מסע לארץ", "הוגה נוצרי שפעל בקיסריה במאה ה־3", "הבישוף הראשון של ירושלים במאה ה־4", "מפקד הצבא הביזנטי בקרב ירמוך"], correct: 1, exp: "אוריגנס הקים בקיסריה מרכז לימוד וספרייה. מאוחר יותר פעל בה אאוזביוס, הבישוף וההיסטוריון." },
      { type: "fill", topic: "התקופה הביזנטית – התנצרות האימפריה", q: "שנת ועידת ניקיאה, שכינס קונסטנטינוס נגד הכפירה האריאנית: ___________________________", answer: "325", exp: "אריוס טען שהבן נברא בידי האב ואינו שווה לו; הוועידה דחתה את עמדתו והכריזה עליו ככופר. מאז חוזר הדגם: ועידה, הכרעה, ורדיפת מי שלא קיבל אותה." },
      { type: "mc", topic: "התקופה הביזנטית – התנצרות האימפריה", q: "על מה נסבה המחלוקת שבגללה כונסה ועידת ניקיאה?", options: ["על הטבע האלוהי והאנושי של ישו (המונופיזיטים)", "על מעמדה של מרים כ'יולדת האל'", "על הערצת האיקונות בכנסיות", "על היחס בין האל האב לבן (הכפירה האריאנית)"], correct: 3, exp: "ניקיאה (325) — אריוס. אפסוס (431) — מרים תאוטוקוס או כריסטוטוקוס. חלקדון (451) — המחלוקת המונופיזיטית. מחלוקת האיקונות היא מן המאה ה־8." },
      { type: "mc", topic: "התקופה הביזנטית – כנסיות, צליינות ובתי כנסת", q: "איזו כנסייה נבנתה ביוזמת קונסטנטינוס ואמו הלנה על הר הזיתים?", options: ["כנסיית סטפנוס הקדוש", "כנסיית הניאה (מריה נאה)", "כנסיית הקטיסמה (מושב מרים)", "כנסיית אלאונה (פטר נוסטר)"], correct: 3, exp: "מפעלי הדור של קונסטנטינוס: כנסיית הקבר, כנסיית המולד, אלאונה (מקום לימוד התלמידים) ואלוני ממרא. הניאה היא של יוסטיניאנוס; סטפנוס — של אבדוקיה." },
      { type: "mc", topic: "התקופה הביזנטית – כנסיות, צליינות ובתי כנסת", q: "מה עשתה הקיסרית אבדוקיה בירושלים?", options: ["בנתה את כנסיית הניאה ואת הקרדו הדרומי", "הרחיבה את חומות העיר דרומה ובנתה את כנסיית סטפנוס", "גילתה את הצלב האמיתי ובנתה את כנסיית הקבר", "השיבה את הצלב לעיר לאחר הכיבוש הפרסי"], correct: 1, exp: "אבדוקיה, אשת תאודוסיוס השני, השתקעה בירושלים באמצע המאה ה־5. חומתה כללה את הר ציון ועיר דוד; כנסיית סטפנוס — מצפון לשער שכם. היא גם חיברה שיר הלל לחמת גדר." },
      { type: "fill", topic: "התקופה הביזנטית – כנסיות, צליינות ובתי כנסת", q: "הקיסר הביזנטי שהשיב את הצלב לירושלים לאחר הכיבוש הפרסי: ___________________________", answer: "הרקליוס", exp: "הפרסים כבשו את ירושלים ב־614. הרקליוס ניצח אותם והשיב את הצלב (629/630), אבל כעבור שנים ספורות הובסו הביזנטים בירמוך (636)." },
      { type: "mc", topic: "התקופה הביזנטית – כנסיות, צליינות ובתי כנסת", q: "מה מאפיין בתי כנסת מטיפוס 'דרום הר חברון', כמו אשתמוע וסוסיא?", options: ["אולם רחב בלי עמודים, וכניסה מצד מזרח", "בנייה בבזלת ומשקופים מעוטרים בנשרים", "חזית מפוארת הפונה לירושלים ורצפת אבן", "אפסיס לארון הקודש ורצפת פסיפס עם גלגל מזלות"], correct: 0, exp: "ארבעת הטיפוסים: גליליים (חזית לירושלים, רצפת אבן — כפר נחום, ברעם), גולניים (בזלת — עין קשתות), דמויי כנסייה (אפסיס ופסיפס — בית אלפא), ודרום הר חברון (אולם רחב, כניסה ממזרח)." },
      { type: "mc", topic: "התקופה הביזנטית – כנסיות, צליינות ובתי כנסת", q: "מהי מסקנת המחקר כיום לגבי ההבדלים בין בתי הכנסת 'הגליליים' לבתי הכנסת הבסיליקליים עם פסיפס?", options: ["הגליליים קדומים, מהמאות ה־2–3, והבסיליקליים מאוחרים", "הגליליים שייכים לתקופת הבית השני", "הבסיליקליים נבנו בידי נוצרים והוסבו לבתי כנסת", "השוני משקף אזור גאוגרפי, ולא זמן בנייה"], correct: 3, exp: "פעם חילקו ל'קדומים' ו'מאוחרים'. מטבעות מן המאה ה־5 מתחת לרצפת כפר נחום ערערו את החלוקה, והיום מקובלת התפיסה האזורית." },

      { type: "mc", topic: "התקופה הרומית – מיבנה עד מרד בר כוכבא", q: "מה היו 'גזרות השמד' של אדריאנוס אחרי מרד בר כוכבא?", options: ["מס גולגולת כבד על כל יהודי באימפריה", "איסור על לימוד תורה, מילה, שבת וכינוס בבתי כנסת", "גירוש כל היהודים מן הגליל לבבל", "איסור על עלייה לרגל לירושלים בלבד"], correct: 1, exp: "אסורים היו גם הסמכת חכמים, בתי דין, תפילין, מזוזה ושופר. בשונה מאנטיוכוס, לא כפו לעבור על מצוות — רק אסרו לקיימן." },

      { type: "mc", topic: "התקופה הרומית – מיבנה עד מרד בר כוכבא", q: "מי מבין החכמים הבאים נמנה עם 'עשרת הרוגי מלכות'?", options: ["רבן יוחנן בן זכאי", "רבן גמליאל דיבנה", "רבי יהודה הנשיא", "רבי עקיבא"], correct: 3, exp: "עשרת הרוגי מלכות הוצאו להורג בימי גזרות אדריאנוס, ובהם רבי עקיבא ורבי יהודה בן בבא. לפי המדרש, רבי עקיבא נקבר בקיסריה." },

      { type: "mc", topic: "התקופה הביזנטית – התנצרות האימפריה", q: "מה עשו הפרסים בירושלים בשנת 614?", options: ["הכריזו על ירושלים כבירת הפרובינציה", "בנו מחדש את כנסיית הניאה שנפגעה", "כבשו את העיר, הרסו כנסיות ושבו את 'הצלב האמיתי'", "מסרו את השלטון בעיר ליהודים לצמיתות"], correct: 2, exp: "הפרסים אכן נעזרו ביהודים ואף מסרו להם את העיר לזמן קצר — אבל לא לצמיתות, ושלוש שנים אחר כך חזרו בהם. שימו לב למילה 'לצמיתות'." },
      { type: "mc", topic: "התקופה הביזנטית – כנסיות, צליינות ובתי כנסת", q: "מה בנה יוסטיניאנוס בבית לחם?", options: ["את כנסיית המולד מחדש", "את מנזר מר סבא", "את כנסיית שדה הרועים הראשונה", "את כנסיית הקטיסמה המתומנת"], correct: 0, exp: "כנסיית המולד הקונסטנטינית נבנתה מחדש בימי יוסטיניאנוס במאה ה־6, ובירושלים הקים את הניאה. מר סבא נוסד בידי סבס ב־483." },
      { type: "mc", topic: "התקופה הביזנטית – כנסיות, צליינות ובתי כנסת", q: "מה מאפיין בתי כנסת 'גליליים', כמו כפר נחום וברעם?", options: ["חזית מפוארת הפונה לירושלים, ורצפת אבן", "בנייה בבזלת וכתובות בארמית בלבד", "אולם רחב בלי עמודים וכניסה ממזרח", "אפסיס לארון הקודש ורצפת פסיפס"], correct: 0, exp: "בעבר נחשבו 'קדומים' (מאות 2–3), אבל מטבעות מן המאה ה־5 מתחת לרצפת כפר נחום הראו שזו אינה הבחנה כרונולוגית." },
      { type: "mc", topic: "התקופה הביזנטית – כנסיות, צליינות ובתי כנסת", q: "באיזה בית כנסת נמצא גלגל המזלות המוקדם בארץ, מן המאה ה־4?", options: ["בית אלפא", "ציפורי", "עין גדי", "חמת טבריה"], correct: 3, exp: "בחמת טבריה, בבית הכנסת של סוורוס. בית אלפא — המאה ה־6; ציפורי — המאה ה־5; בעין גדי שמות המזלות כתובים בלי ציור." },
      { type: "mc", topic: "התקופה הביזנטית – כנסיות, צליינות ובתי כנסת", q: "מה מאפיין את הכנסייה מטיפוס 'מבנה מרכזי' (עגול או מתומן)?", options: ["נבנתה כאולם אורך עם תווך וסטרות", "נבנתה תמיד בתוך מחנה של הצבא הביזנטי", "נבנתה סביב מוקד מקודש — סלע או קבר — להנצחתו", "שימשה כמנזר לנזירים המתבודדים במדבר"], correct: 2, exp: "דוגמאות: הרוטונדה של כנסיית הקבר, כנסיית הקטיסמה. גם כיפת הסלע, שאינה נוצרית, בנויה כך — וכבר הפנתאון ברומא." },

let state = { exam: null, mcAnswers: {}, openRatings: {} };
let topicState = { exam: null, mcAnswers: {}, fillRatings: {} };
let currentMode = null; // "classic" | "topic"

const app = document.getElementById("app");
const scorebar = document.getElementById("scorebar");

function computeScore(examNum) {
  const exam = EXAMS[examNum];
  let earned = 0, possible = exam.mc.length * 2 + exam.open.length * 2;
  exam.mc.forEach((_, i) => { if (state.mcAnswers[i] !== undefined && state.mcAnswers[i] === exam.mc[i].correct) earned += 2; });
  exam.open.forEach((_, i) => { if (state.openRatings[i] !== undefined) earned += state.openRatings[i]; });
  return { earned, possible };
}

// מבחני דגשי הרכז משתמשים באותו מנוע כמו המבחנים הנושאיים
Object.assign(TOPIC_EXAMS, FOCUS_EXAMS);
Object.assign(TOPIC_EXAMS, TEMPLE_EXAMS);

function computeTopicScore(examNum) {
  const exam = TOPIC_EXAMS[examNum];
  let earned = 0, possible = exam.items.length * 2;
  exam.items.forEach((item, i) => {
    if (item.type === "mc") {
      if (topicState.mcAnswers[i] !== undefined && topicState.mcAnswers[i] === item.correct) earned += 2;
    } else {
      if (topicState.fillRatings[i] !== undefined) earned += topicState.fillRatings[i];
    }
  });
  return { earned, possible };
}

function topicBucket(t) {
  const i = t.indexOf(" – ");
  return i === -1 ? t : t.slice(0, i);
}

function updateScorebar() {
  if (currentMode === "classic" && state.exam !== null) {
    const { earned, possible } = computeScore(state.exam);
    scorebar.style.display = "block";
    scorebar.textContent = "ציון נוכחי: " + earned + " / " + possible + " נקודות";
  } else if (currentMode === "topic" && topicState.exam !== null) {
    const { earned, possible } = computeTopicScore(topicState.exam);
    scorebar.style.display = "block";
    scorebar.textContent = "ציון נוכחי: " + earned + " / " + possible + " נקודות";
  } else {
    scorebar.style.display = "none";
  }
}

function renderResults(n) {
  const exam = EXAMS[n];

  const topics = {};
  exam.mc.forEach((item, i) => {
    topics[item.topic] = topics[item.topic] || { earned: 0, possible: 0 };
    topics[item.topic].possible += 2;
    if (state.mcAnswers[i] === item.correct) topics[item.topic].earned += 2;

    topics[item.topic] = topics[item.topic] || { earned: 0, possible: 0 };
    topics[item.topic].possible += 2;
    topics[item.topic].earned += state.openRatings[i] || 0;

    rows += '<div class="breakdown-row"><span>' + t + '</span><span>' + topics[t].earned + ' / ' + topics[t].possible + '</span></div>';

    '<div class="big-score">' + earned + ' / ' + possible + '</div>' +
    '<div class="pct">' + pct + '% הצלחה</div>' +

  let rows = "";
  Object.keys(topics).forEach((t) => {
    rows += '<div class="breakdown-row"><span>' + t + '</span><span>' + topics[t].earned + ' / ' + topics[t].possible + '</span></div>';
  });
  box.innerHTML =
    '<div>סיימתם את ' + exam.title + '</div>' +
    '<div class="big-score">' + earned + ' / ' + possible + '</div>' +
    '<div class="pct">' + pct + '% הצלחה</div>' +
    '<div class="breakdown">' + rows + '</div>';
  app.appendChild(box);

  const restart = document.createElement("button");
  restart.className = "restart-btn";
  restart.textContent = "חזרה לבחירת מבחן";
  restart.onclick = renderSelect;
  const centerWrap = document.createElement("div");
  centerWrap.style.textAlign = "center";
  centerWrap.appendChild(restart);
  app.appendChild(centerWrap);
  window.scrollTo(0, 0);
}

renderSelect();
</script>
</body>
</html>
