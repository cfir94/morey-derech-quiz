<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מבחני תרגול אינטראקטיביים — מורי דרך</title>
<style>
  :root {
    --teal: #0F6E56;
    --teal-light: #E1F5EE;
    --teal-mid: #5DCAA5;
    --red: #A32D2D;
    --red-light: #FCEBEB;
    --amber: #854F0B;
    --amber-light: #FAEEDA;
    --ink: #2C2C2A;
    --sub: #5F5E5A;
    --border: #D3D1C7;
    --bg: #FAF9F6;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    padding: 0 0 60px;
    line-height: 1.6;
  }
  header {
    background: var(--teal);
    color: white;
    padding: 18px 24px;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  header h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
  header .sub { font-size: 13px; opacity: 0.9; }
  #scorebar {
    display: none;
    margin-top: 10px;
    font-size: 15px;
    font-weight: 600;
    background: rgba(255,255,255,0.15);
    border-radius: 8px;
    padding: 8px 14px;
  }
  main { max-width: 780px; margin: 0 auto; padding: 24px 16px; }
  .select-screen { text-align: center; padding: 40px 16px; }
  .select-screen h2 { font-size: 22px; margin-bottom: 24px; }
  .exam-btn {
    display: block;
    width: 100%;
    max-width: 420px;
    margin: 0 auto 16px;
    padding: 18px;
    font-size: 17px;
    font-weight: 600;
    background: white;
    border: 2px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    color: var(--ink);
    transition: all 0.15s;
  }
  .exam-btn:hover { border-color: var(--teal); background: var(--teal-light); }
  .section-title {
    font-size: 19px;
    font-weight: 600;
    margin: 32px 0 14px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--teal);
    color: var(--teal);
  }
  .qcard {
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .qtopic {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    color: var(--teal);
    background: var(--teal-light);
    border-radius: 6px;
    padding: 2px 9px;
    margin-bottom: 8px;
  }
  .qtext { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
  .opt {
    display: block;
    width: 100%;
    text-align: right;
    padding: 11px 14px;
    margin-bottom: 8px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: white;
    font-size: 15px;
    cursor: pointer;
    color: var(--ink);
    transition: all 0.12s;
  }
  .opt:hover:not(.locked) { border-color: var(--teal); background: var(--teal-light); }
  .opt.correct { background: var(--teal-light); border-color: var(--teal); color: var(--teal); font-weight: 600; }
  .opt.incorrect { background: var(--red-light); border-color: var(--red); color: var(--red); font-weight: 600; }
  .opt.locked { cursor: default; }
  .explain {
    margin-top: 10px;
    font-size: 13.5px;
    color: var(--sub);
    background: #F5F4F0;
    border-radius: 8px;
    padding: 10px 12px;
    display: none;
  }
  textarea {
    width: 100%;
    min-height: 90px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 14.5px;
    resize: vertical;
    margin-bottom: 10px;
  }
  .reveal-btn, .finish-btn, .restart-btn {
    background: var(--teal);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .reveal-btn:hover, .finish-btn:hover, .restart-btn:hover { background: #0c5744; }
  .model-answer {
    display: none;
    margin-top: 12px;
    background: var(--amber-light);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 14.5px;
    color: var(--amber);
  }
  .rate-row { display: none; margin-top: 12px; gap: 8px; flex-wrap: wrap; }
  .rate-btn {
    padding: 8px 14px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: white;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 600;
    margin-left: 8px;
  }
  .rate-btn.active-2 { background: var(--teal-light); border-color: var(--teal); color: var(--teal); }
  .rate-btn.active-1 { background: var(--amber-light); border-color: var(--amber); color: var(--amber); }
  .rate-btn.active-0 { background: var(--red-light); border-color: var(--red); color: var(--red); }
  .finish-wrap { text-align: center; margin: 32px 0; }
  .results-box {
    background: white;
    border: 2px solid var(--teal);
    border-radius: 14px;
    padding: 28px 24px;
    text-align: center;
    margin-bottom: 24px;
  }
  .results-box .big-score { font-size: 42px; font-weight: 700; color: var(--teal); margin: 8px 0; }
  .results-box .pct { font-size: 17px; color: var(--sub); margin-bottom: 4px; }
  .breakdown { text-align: right; margin-top: 20px; }
  .breakdown-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 4px;
    border-bottom: 1px solid var(--border);
    font-size: 14.5px;
  }
  .hidden { display: none !important; }
  .backlink { display: inline-block; margin-top: 18px; color: var(--teal); cursor: pointer; font-size: 14px; text-decoration: underline; }
</style>
</head>
<body>

<header>
  <h1>מבחני תרגול אינטראקטיביים — קורס מורי דרך</h1>
  <div class="sub">כל שאלה שווה 2 נקודות. לחצו על תשובה כדי לבדוק אותה מיד.</div>

      { topic: "גיאולוגיה", q: "סלע כהה, כבד וקשה, שנוצר מקילוחי לבה ובונה משטחים נרחבים בגולן, נקרא:", options: ["גרניט", "בזלת", "קירטון", "חוואר"], correct: 1, exp: "בזלת היא סלע וולקני האופייני לרמת הגולן." },
      { topic: "גיאולוגיה", q: "מה ההבדל העיקרי בין קירטון לגיר?", options: ["קירטון תוסס בחומצה וגיר לא", "קירטון רך ונשבר בקלות, בעוד גיר קשה", "גיר הוא סלע מגמתי וקירטון סלע משקע", "אין הבדל ביניהם"], correct: 1, exp: "קירטון רך ונמרח כסיד, ואילו הגיר קשה יותר." },
      { topic: "גיאולוגיה", q: "בקע ים המלח, מבחינה טקטונית, נחשב לגבול:", options: ["התרחקות קלאסי", "טרנספורם (החלקה אופקית) עם שקיעה של גרבן", "התנגשות בין לוחות", "געשי פעיל בלבד"], correct: 1, exp: "זהו גבול גזירה/טרנספורם, בעיקרו תנועה אופקית, לצידה שקיעה נורמלית." },
      { topic: "גיאולוגיה", q: "ההעתקה האופקית המצטברת לאורך בקע ים המלח מוערכת בכ:", options: ["10 ק\"מ", "50 ק\"מ", "105 ק\"מ", "300 ק\"מ"], correct: 2, exp: "כ-105 ק\"מ הצטברו לאורך מיליוני שנים בין לוח ערב ללוח סיני-ישראל." },
      { topic: "גיאולוגיה", q: "המסה קרסטית, כמו במערת שורק, מתרחשת כאשר:", options: ["לבה מתקררת ומתכווצת", "מי גשמים סופחים CO2 והופכים לחומצה חלשה הממיסה קלציט", "שכבת חוואר חוסמת מים", "לוחות טקטוניים מחליקים זה לצד זה"], correct: 1, exp: "חומצה קלה הנוצרת ממי גשמים ו-CO2 ממיסה לאט את הקלציט בגיר." },
      { topic: "גיאולוגיה", q: "סטייה ימנית בקו השבר הסורי-אפריקני, כמו זו שיצרה את הר החרמון, גורמת ל:", options: ["שקיעה ויצירת אגן", "התנגשות ולחיצה שמרימה קרקע", "היווצרות מכתשים", "בליה קרסטית מואצת"], correct: 1, exp: "הסטייה יוצרת לחיצה בין הלוחות, שמרימה את הקרקע." },
    ],
    open: [
      { topic: "פרהיסטוריה", q: "מהם שני ההישגים העיקריים המזוהים עם התרבות הנטופית, ומדוע הם נחשבים 'מהפכניים'?", model: "הנטופים היו הראשונים בעולם, ככל הנראה, שהתיישבו בקבע ובנו באבן — הישגים שקדמו למהפכה החקלאית ולא נבעו ממנה, בניגוד למקובל לחשוב." },
      { topic: "תקופת הברונזה", q: "פרטו שני ממצאים המעידים על מגידו כמרכז עשיר ובעל קשרים בינלאומיים בברונזה המאוחרת.", model: "אוסף איתורי השנהב שנמצא בארמון מגידו מעיד על פריחה אמנותית וסחר יוקרה. מכתבי אל-עמארנה מתעדים את מעורבותה בדרמה הפוליטית תחת השלטון המצרי האימפריאלי." },
      { topic: "ארכיאולוגיה", q: "מהם שלושת ההיבטים המרכזיים של העבודה הארכיאולוגית, וכיצד הם קשורים זה לזה?", model: "מחקר (חפירה וניתוח), שימור (הגנה על הממצא) והנחלה (הנגשתו לציבור) — שלושת ההיבטים משלימים זה את זה והופכים תגלית לנחלת הכלל." },
      { topic: "חי וצומח", q: "תנו דוגמה אחת מהחי ודוגמה אחת מהצומח לפריטים בולטים ומזוהים במיוחד עם ישראל.", model: "מהחי: הדוכיפת, הציפור הלאומית של ישראל. מהצומח: הכלנית המצויה, הפרח הלאומי של ישראל." },
      { topic: "צומח", q: "הסבירו את ההבדל בין תצורת ה'חורש' לתצורת ה'יער פארק'.", model: "חורש הוא מקבץ עצים סבוך בגובה 5–8 מ' (כמו אלון מצוי). יער פארק, כמו יער יהודיה, מאופיין בעצים מרווחים מאוד עם עשבים גדלים ביניהם, ולא מקבץ צפוף." },
      { topic: "גיאולוגיה", q: "תארו את 'מסע גרגיר הקוורץ' ממחזור הסלעים, מהרי אילת ועד הגולן.", model: "גרגיר קוורץ מתחיל כגרניט (מגמתי) בהרי אילת. בליה הופכת אותו לאבן חול (משקע) בתמנע או ברמון. חדירת מאגמה 'אופה' אותו לקוורציט (מטמורפי). בעתיד הוא עשוי להיתך שוב ולצאת כבזלת (מגמתי) בגולן." },
    ]
  }
};

let state = { exam: null, mcAnswers: {}, openRatings: {} };

const app = document.getElementById("app");
const scorebar = document.getElementById("scorebar");

function computeScore(examNum) {
  const exam = EXAMS[examNum];
  let earned = 0, possible = exam.mc.length * 2 + exam.open.length * 2;
  exam.mc.forEach((_, i) => { if (state.mcAnswers[i] !== undefined && state.mcAnswers[i] === exam.mc[i].correct) earned += 2; });
  exam.open.forEach((_, i) => { if (state.openRatings[i] !== undefined) earned += state.openRatings[i]; });
  return { earned, possible };
}

function updateScorebar() {
  if (state.exam === null) { scorebar.style.display = "none"; return; }
  const { earned, possible } = computeScore(state.exam);
  scorebar.style.display = "block";
  scorebar.textContent = "ציון נוכחי: " + earned + " / " + possible + " נקודות";
}

function renderSelect() {
  state = { exam: null, mcAnswers: {}, openRatings: {} };
  updateScorebar();
  app.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "select-screen";
  wrap.innerHTML = "<h2>בחרו מבחן תרגול</h2>";
  [1, 2, 3, 4, 5].forEach((n) => {
    const btn = document.createElement("button");
    btn.className = "exam-btn";
    btn.textContent = EXAMS[n].title + " — 24 אמריקאיות + 6 פתוחות (60 נק')";
    btn.onclick = () => renderExam(n);
    wrap.appendChild(btn);
  });
  app.appendChild(wrap);
}

function renderExam(n) {
  state = { exam: n, mcAnswers: {}, openRatings: {} };
  const exam = EXAMS[n];
  app.innerHTML = "";

  const h = document.createElement("div");
  h.className = "section-title";
  h.textContent = exam.title + " — חלק א': שאלות אמריקאיות";
  app.appendChild(h);

  exam.mc.forEach((item, i) => {
    const card = document.createElement("div");
    card.className = "qcard";
    card.innerHTML = '<div class="qtopic">' + item.topic + '</div><div class="qtext">' + (i + 1) + '. ' + item.q + '</div>';
    const optWrap = document.createElement("div");
    const letters = ["א", "ב", "ג", "ד"];
    item.options.forEach((opt, oi) => {
      const b = document.createElement("button");
      b.className = "opt";
      b.textContent = letters[oi] + ". " + opt;
      b.onclick = () => {
        if (state.mcAnswers[i] !== undefined) return;
        state.mcAnswers[i] = oi;
        const btns = optWrap.querySelectorAll(".opt");
        btns.forEach((bb, bi) => {
          bb.classList.add("locked");
          if (bi === item.correct) bb.classList.add("correct");
          else if (bi === oi) bb.classList.add("incorrect");
        });
        card.querySelector(".explain").style.display = "block";
        updateScorebar();
      };
      optWrap.appendChild(b);
    });
    card.appendChild(optWrap);
    const exp = document.createElement("div");
    exp.className = "explain";
    exp.textContent = item.exp;
    card.appendChild(exp);
    app.appendChild(card);
  });

  const h2 = document.createElement("div");
  h2.className = "section-title";
  h2.textContent = "חלק ב': שאלות פתוחות";
  app.appendChild(h2);

  exam.open.forEach((item, i) => {
    const card = document.createElement("div");
    card.className = "qcard";
    card.innerHTML = '<div class="qtopic">' + item.topic + '</div><div class="qtext">' + (i + 1) + '. ' + item.q + '</div>';
    const ta = document.createElement("textarea");
    ta.placeholder = "כתבו כאן את תשובתכם...";
    card.appendChild(ta);
    const revealBtn = document.createElement("button");
    revealBtn.className = "reveal-btn";
    revealBtn.textContent = "הצג תשובת מודל ובדקו את עצמכם";
    const modelDiv = document.createElement("div");
    modelDiv.className = "model-answer";
    modelDiv.textContent = item.model;
    const rateRow = document.createElement("div");
    rateRow.className = "rate-row";
    rateRow.style.display = "none";
    const ratings = [["מלאה (2)", 2], ["חלקית (1)", 1], ["שגויה (0)", 0]];
    ratings.forEach(([label, val]) => {
      const rb = document.createElement("button");
      rb.className = "rate-btn";
      rb.textContent = label;
      rb.onclick = () => {
        state.openRatings[i] = val;
        rateRow.querySelectorAll(".rate-btn").forEach((x) => { x.className = "rate-btn"; });
        rb.classList.add("active-" + val);
        updateScorebar();
      };
      rateRow.appendChild(rb);
    });
    revealBtn.onclick = () => {
      modelDiv.style.display = "block";
      rateRow.style.display = "flex";
      revealBtn.style.display = "none";
    };
    card.appendChild(revealBtn);
    card.appendChild(modelDiv);
    card.appendChild(rateRow);
    app.appendChild(card);
  });

  const finishWrap = document.createElement("div");
  finishWrap.className = "finish-wrap";
  const finishBtn = document.createElement("button");
  finishBtn.className = "finish-btn";
  finishBtn.textContent = "סיים מבחן והצג ציון סופי";
  finishBtn.onclick = () => renderResults(n);
  finishWrap.appendChild(finishBtn);
  app.appendChild(finishWrap);

  updateScorebar();
  window.scrollTo(0, 0);
}

function renderResults(n) {
  const exam = EXAMS[n];
  const { earned, possible } = computeScore(n);
  const pct = Math.round((earned / possible) * 100);

  const topics = {};
  exam.mc.forEach((item, i) => {
    topics[item.topic] = topics[item.topic] || { earned: 0, possible: 0 };
    topics[item.topic].possible += 2;
    if (state.mcAnswers[i] === item.correct) topics[item.topic].earned += 2;
  });
  exam.open.forEach((item, i) => {
    topics[item.topic] = topics[item.topic] || { earned: 0, possible: 0 };
    topics[item.topic].possible += 2;
    topics[item.topic].earned += state.openRatings[i] || 0;
  });

  app.innerHTML = "";
  const box = document.createElement("div");
  box.className = "results-box";
  let rows = "";
  Object.keys(topics).forEach((t) => {
    rows += '<div class="breakdown-row"><span>' + t + '</span><span>' + topics[t].earned + ' / ' + topics[t].possible + '</span></div>';
  });
  box.innerHTML =
    '<div>סיימתם את ' + exam.title + '</div>' +
    '<div class="big-score">' + earned + ' / ' + possible + '</div>' +
    '<div class="pct">' + pct + '% הצלחה</div>' +
    '<div class="breakdown">' + rows + '</div>';
  app.appendChild(box);

  const restart = document.createElement("button");
  restart.className = "restart-btn";
  restart.textContent = "חזרה לבחירת מבחן";
  restart.onclick = renderSelect;
  const centerWrap = document.createElement("div");
  centerWrap.style.textAlign = "center";
  centerWrap.appendChild(restart);
  app.appendChild(centerWrap);
  window.scrollTo(0, 0);
}

renderSelect();
</script>
</body>
</html>
