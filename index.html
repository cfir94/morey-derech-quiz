<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מבחני תרגול אינטראקטיביים — מורי דרך</title>
<style>
  :root {
    --teal: #0F6E56;
    --teal-light: #E1F5EE;
    --teal-mid: #5DCAA5;
    --red: #A32D2D;
    --red-light: #FCEBEB;
    --amber: #854F0B;
    --amber-light: #FAEEDA;
    --ink: #2C2C2A;
    --sub: #5F5E5A;
    --border: #D3D1C7;
    --bg: #FAF9F6;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    padding: 0 0 60px;
    line-height: 1.6;
  }
  header {
    background: var(--teal);
    color: white;
    padding: 18px 24px;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  header h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
  header .sub { font-size: 13px; opacity: 0.9; }
  #scorebar {
    display: none;
    margin-top: 10px;
    font-size: 15px;
    font-weight: 600;
    background: rgba(255,255,255,0.15);
    border-radius: 8px;
    padding: 8px 14px;
  }
  main { max-width: 780px; margin: 0 auto; padding: 24px 16px; }
  .select-screen { text-align: center; padding: 40px 16px; }
  .select-screen h2 { font-size: 22px; margin-bottom: 24px; }
  .exam-btn {
    display: block;
    width: 100%;
    max-width: 420px;
    margin: 0 auto 16px;
    padding: 18px;
    font-size: 17px;
    font-weight: 600;
    background: white;
    border: 2px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    color: var(--ink);
    transition: all 0.15s;
  }
  .exam-btn:hover { border-color: var(--teal); background: var(--teal-light); }
  .section-title {
    font-size: 19px;
    font-weight: 600;
    margin: 32px 0 14px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--teal);
    color: var(--teal);
  }
  .qcard {
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .qtopic {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    color: var(--teal);
    background: var(--teal-light);
    border-radius: 6px;
    padding: 2px 9px;
    margin-bottom: 8px;
  }
  .qtext { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
  .opt {
    display: block;
    width: 100%;
    text-align: right;
    padding: 11px 14px;
    margin-bottom: 8px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: white;
    font-size: 15px;
    cursor: pointer;
    color: var(--ink);
    transition: all 0.12s;
  }
  .opt:hover:not(.locked) { border-color: var(--teal); background: var(--teal-light); }
  .opt.correct { background: var(--teal-light); border-color: var(--teal); color: var(--teal); font-weight: 600; }
  .opt.incorrect { background: var(--red-light); border-color: var(--red); color: var(--red); font-weight: 600; }
  .opt.locked { cursor: default; }
  .explain {
    margin-top: 10px;
    font-size: 13.5px;
    color: var(--sub);
    background: #F5F4F0;
    border-radius: 8px;
    padding: 10px 12px;
    display: none;
  }
  textarea {
    width: 100%;
    min-height: 90px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 14.5px;
    resize: vertical;
    margin-bottom: 10px;
  }
  .reveal-btn, .finish-btn, .restart-btn {
    background: var(--teal);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .reveal-btn:hover, .finish-btn:hover, .restart-btn:hover { background: #0c5744; }
  .model-answer {
    display: none;
    margin-top: 12px;
    background: var(--amber-light);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 14.5px;
    color: var(--amber);
  }
  .rate-row { display: none; margin-top: 12px; gap: 8px; flex-wrap: wrap; }
  .rate-btn {
    padding: 8px 14px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: white;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 600;
    margin-left: 8px;
  }
  .rate-btn.active-2 { background: var(--teal-light); border-color: var(--teal); color: var(--teal); }
  .rate-btn.active-1 { background: var(--amber-light); border-color: var(--amber); color: var(--amber); }
  .rate-btn.active-0 { background: var(--red-light); border-color: var(--red); color: var(--red); }
  .finish-wrap { text-align: center; margin: 32px 0; }
  .results-box {
    background: white;
    border: 2px solid var(--teal);
    border-radius: 14px;
    padding: 28px 24px;
    text-align: center;
    margin-bottom: 24px;
  }
  .results-box .big-score { font-size: 42px; font-weight: 700; color: var(--teal); margin: 8px 0; }
  .results-box .pct { font-size: 17px; color: var(--sub); margin-bottom: 4px; }
  .breakdown { text-align: right; margin-top: 20px; }
  .breakdown-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 4px;
    border-bottom: 1px solid var(--border);
    font-size: 14.5px;
  }
  .hidden { display: none !important; }
  .backlink { display: inline-block; margin-top: 18px; color: var(--teal); cursor: pointer; font-size: 14px; text-decoration: underline; }
  .fill-input {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 14.5px;
    margin-bottom: 10px;
    font-family: inherit;
  }
  .section-sub { text-align: center; font-size: 13.5px; color: var(--sub); margin: -14px 0 24px; }
</style>
</head>
<body>

<header>
  <h1>מבחני תרגול אינטראקטיביים — קורס מורי דרך</h1>
  <div class="sub">כל שאלה שווה 2 נקודות. לחצו על תשובה כדי לבדוק אותה מיד.</div>
  <div id="scorebar"></div>
</header>

<main id="app"></main>

<script>

      { topic: "גבולות ותקופות", q: "הגבול ההלכתי ('ארץ ישראל הקדושה') עוסק ב:", options: ["גבולות מנהליים של האימפריה הרומית", "תחומים גאוגרפיים שבהם חלות מצוות התלויות בארץ", "הגבול המקראי הרחב מנהר מצרים ועד פרת", "חלוקת הארץ לסנג'אקים עות'מאניים"], correct: 1, exp: "נוסח ב'ברייתא דתחומין' ובכתובת רחוב — מגדיר היכן חלות מצוות כמו שמיטה." },
      { topic: "חי", q: "הציפור הנחשבת לציפור הלאומית של ישראל היא:", options: ["הדוכיפת", "הנשר", "הדאה שחורת-הכתף", "הכטופה"], correct: 0, exp: "הדוכיפת נבחרה כציפור הלאומית של ישראל." },

      { type: "mc", topic: "יהדות – ארון ספרים", q: "מי חיבר את ה'שולחן ערוך'?", options: ["הרמ\"א", "הרמב\"ם", "רש\"י", "ר' יוסף קארו"], correct: 3, exp: "ר' יוסף קארו חיברו בצפת במאה ה-16; הרמ\"א הוסיף הגהות מנהגי אשכנז." },
      { type: "mc", topic: "תקופת הברזל – ברזל א'", q: "היכן שכן, ככל הנראה, המשכן וארון הברית בימי עלי ושמואל?", options: ["חברון", "גבעה", "גלגל", "שילה"], correct: 3, exp: "שילה שימשה כמרכז הפולחני-הלאומי עד חורבנה במאה ה-11 לפנה\"ס." },
      { type: "mc", topic: "גבולות – עת חדשה", q: "מה קבע הסכם ניוקומב-פולה (1923-1924)?", options: ["הגבול הדרומי מול מצרים", "קווי שביתת הנשק מול סוריה", "גבול הצפון ו'אצבע הגליל'", "הגבול המזרחי מול ירדן"], correct: 2, exp: "נקבע כך שהכנרת והירדן העליון נשארו בשלמותם בתחום המנדט הבריטי." },
      { type: "mc", topic: "יהדות – ארון ספרים", q: "היכן נחתם התלמוד הירושלמי, ומתי בקירוב?", options: ["בירושלים, במאה ה-3", "בטבריה, בסביבות שנת 400", "בבבל, בסביבות שנת 500", "בציפורי, במאה ה-2"], correct: 1, exp: "התלמוד הירושלמי נחתם בטבריה כ-100 שנה לפני הבבלי." },
      { type: "mc", topic: "נצרות – זרמים", q: "מי תלה את 95 התזות על דלת כנסיית הטירה בוויטנברג ב-1517?", options: ["מרטין לותר", "ז'אן קלווין", "קונסטנטינוס", "פרנציסקוס מאסיזי"], correct: 0, exp: "מרטין לותר פתח בכך את הרפורמציה הפרוטסטנטית." },
    ]
  },
};

let state = { exam: null, mcAnswers: {}, openRatings: {} };
let topicState = { exam: null, mcAnswers: {}, fillRatings: {} };
let currentMode = null; // "classic" | "topic"

const app = document.getElementById("app");
const scorebar = document.getElementById("scorebar");

function computeScore(examNum) {
  const exam = EXAMS[examNum];
  let earned = 0, possible = exam.mc.length * 2 + exam.open.length * 2;
  exam.mc.forEach((_, i) => { if (state.mcAnswers[i] !== undefined && state.mcAnswers[i] === exam.mc[i].correct) earned += 2; });
  exam.open.forEach((_, i) => { if (state.openRatings[i] !== undefined) earned += state.openRatings[i]; });
  return { earned, possible };
}

// מבחני דגשי הרכז משתמשים באותו מנוע כמו המבחנים הנושאיים
Object.assign(TOPIC_EXAMS, FOCUS_EXAMS);

function computeTopicScore(examNum) {
  const exam = TOPIC_EXAMS[examNum];
  let earned = 0, possible = exam.items.length * 2;
  exam.items.forEach((item, i) => {
    if (item.type === "mc") {
      if (topicState.mcAnswers[i] !== undefined && topicState.mcAnswers[i] === item.correct) earned += 2;
    } else {
      if (topicState.fillRatings[i] !== undefined) earned += topicState.fillRatings[i];
    }
  });
  return { earned, possible };
}

function topicBucket(t) {
  const i = t.indexOf(" – ");
  return i === -1 ? t : t.slice(0, i);
}

function updateScorebar() {
  if (currentMode === "classic" && state.exam !== null) {
    const { earned, possible } = computeScore(state.exam);
    scorebar.style.display = "block";
    scorebar.textContent = "ציון נוכחי: " + earned + " / " + possible + " נקודות";
  } else if (currentMode === "topic" && topicState.exam !== null) {
    const { earned, possible } = computeTopicScore(topicState.exam);
    scorebar.style.display = "block";
    scorebar.textContent = "ציון נוכחי: " + earned + " / " + possible + " נקודות";
  } else {
    scorebar.style.display = "none";
  }
}

function renderSelect() {
  state = { exam: null, mcAnswers: {}, openRatings: {} };
  topicState = { exam: null, mcAnswers: {}, fillRatings: {} };
  currentMode = null;
  updateScorebar();
  app.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "select-screen";
  wrap.innerHTML = "<h2>בחרו מבחן תרגול</h2>";

  const h0 = document.createElement("div");
  h0.className = "section-title";
  h0.textContent = "מבחני דגשי הרכז — לפי מפגש החזרה לקראת המבחן";
  wrap.appendChild(h0);
  const sub0 = document.createElement("div");
  sub0.className = "section-sub";
  sub0.textContent = "50 שאלות במתכונת המבחן: כ-38 אמריקאיות וכ-12 פתוחות (תשובה של מילה עד שלוש)";
  wrap.appendChild(sub0);
  [6, 7, 8, 9, 10].forEach((n) => {
    const btn = document.createElement("button");
    btn.className = "exam-btn";
    btn.textContent = TOPIC_EXAMS[n].title + " — 50 שאלות (100 נק')";
    btn.onclick = () => renderTopicExam(n);
    wrap.appendChild(btn);
  });

  const h2 = document.createElement("div");
  h2.className = "section-title";
  h2.style.marginTop = "36px";
  h2.textContent = "מבחנים נושאיים — נצרות, יהדות, תקופת הברזל, גבולות ארץ ישראל";
  wrap.appendChild(h2);
  const sub = document.createElement("div");
  sub.className = "section-sub";
  sub.textContent = "50 שאלות בכל מבחן: תערובת של אמריקאיות והשלמת מקום";
  wrap.appendChild(sub);
  [1, 2, 3, 4, 5].forEach((n) => {
    const btn = document.createElement("button");
    btn.className = "exam-btn";
    btn.textContent = TOPIC_EXAMS[n].title + " — 50 שאלות (100 נק')";
    btn.onclick = () => renderTopicExam(n);
    wrap.appendChild(btn);
  });
  const h1 = document.createElement("div");
  h1.className = "section-title";
  h1.style.marginTop = "36px";
  h1.textContent = "מבחנים קלאסיים — חי, צומח, ארכיאולוגיה, תקופת הברונזה, גיאולוגיה";
  wrap.appendChild(h1);
  const sub1 = document.createElement("div");
  sub1.className = "section-sub";
  sub1.textContent = "24 אמריקאיות + 6 פתוחות בכל מבחן";
  wrap.appendChild(sub1);
  [1, 2, 3, 4, 5].forEach((n) => {
    const btn = document.createElement("button");
    btn.className = "exam-btn";
    btn.textContent = EXAMS[n].title + " — 24 אמריקאיות + 6 פתוחות (60 נק')";
    btn.onclick = () => renderExam(n);
    wrap.appendChild(btn);
  });
  app.appendChild(wrap);
}

function renderExam(n) {
  state = { exam: n, mcAnswers: {}, openRatings: {} };
  currentMode = "classic";
  const exam = EXAMS[n];
  app.innerHTML = "";

  const h = document.createElement("div");
  h.className = "section-title";
  h.textContent = exam.title + " — חלק א': שאלות אמריקאיות";
  app.appendChild(h);

  exam.mc.forEach((item, i) => {
    const card = document.createElement("div");
    card.className = "qcard";
    card.innerHTML = '<div class="qtopic">' + item.topic + '</div><div class="qtext">' + (i + 1) + '. ' + item.q + '</div>';
    const optWrap = document.createElement("div");
    const letters = ["א", "ב", "ג", "ד"];
    item.options.forEach((opt, oi) => {
      const b = document.createElement("button");
      b.className = "opt";
      b.textContent = letters[oi] + ". " + opt;
      b.onclick = () => {
        if (state.mcAnswers[i] !== undefined) return;
        state.mcAnswers[i] = oi;
        const btns = optWrap.querySelectorAll(".opt");
        btns.forEach((bb, bi) => {
          bb.classList.add("locked");
          if (bi === item.correct) bb.classList.add("correct");
          else if (bi === oi) bb.classList.add("incorrect");
        });
        card.querySelector(".explain").style.display = "block";
        updateScorebar();
      };
      optWrap.appendChild(b);
    });
    card.appendChild(optWrap);
    const exp = document.createElement("div");
    exp.className = "explain";
    exp.textContent = item.exp;
    card.appendChild(exp);
    app.appendChild(card);
  });

  const h2 = document.createElement("div");
  h2.className = "section-title";
  h2.textContent = "חלק ב': שאלות פתוחות";
  app.appendChild(h2);

  exam.open.forEach((item, i) => {
    const card = document.createElement("div");
    card.className = "qcard";
    card.innerHTML = '<div class="qtopic">' + item.topic + '</div><div class="qtext">' + (i + 1) + '. ' + item.q + '</div>';
    const ta = document.createElement("textarea");
    ta.placeholder = "כתבו כאן את תשובתכם...";
    card.appendChild(ta);
    const revealBtn = document.createElement("button");
    revealBtn.className = "reveal-btn";
    revealBtn.textContent = "הצג תשובת מודל ובדקו את עצמכם";
    const modelDiv = document.createElement("div");
    modelDiv.className = "model-answer";
    modelDiv.textContent = item.model;
    const rateRow = document.createElement("div");
    rateRow.className = "rate-row";
    rateRow.style.display = "none";
    const ratings = [["מלאה (2)", 2], ["חלקית (1)", 1], ["שגויה (0)", 0]];
    ratings.forEach(([label, val]) => {
      const rb = document.createElement("button");
      rb.className = "rate-btn";
      rb.textContent = label;
      rb.onclick = () => {
        state.openRatings[i] = val;
        rateRow.querySelectorAll(".rate-btn").forEach((x) => { x.className = "rate-btn"; });
        rb.classList.add("active-" + val);
        updateScorebar();
      };
      rateRow.appendChild(rb);
    });
    revealBtn.onclick = () => {
      modelDiv.style.display = "block";
      rateRow.style.display = "flex";
      revealBtn.style.display = "none";
    };
    card.appendChild(revealBtn);
    card.appendChild(modelDiv);
    card.appendChild(rateRow);
    app.appendChild(card);
  });

  const finishWrap = document.createElement("div");
  finishWrap.className = "finish-wrap";
  const finishBtn = document.createElement("button");
  finishBtn.className = "finish-btn";
  finishBtn.textContent = "סיים מבחן והצג ציון סופי";
  finishBtn.onclick = () => renderResults(n);
  finishWrap.appendChild(finishBtn);
  app.appendChild(finishWrap);

  updateScorebar();
  window.scrollTo(0, 0);
}

function renderResults(n) {
  const exam = EXAMS[n];
  const { earned, possible } = computeScore(n);
  const pct = Math.round((earned / possible) * 100);

  const topics = {};
  exam.mc.forEach((item, i) => {
    topics[item.topic] = topics[item.topic] || { earned: 0, possible: 0 };
    topics[item.topic].possible += 2;
    if (state.mcAnswers[i] === item.correct) topics[item.topic].earned += 2;
  });
  exam.open.forEach((item, i) => {
    topics[item.topic] = topics[item.topic] || { earned: 0, possible: 0 };
    topics[item.topic].possible += 2;
    topics[item.topic].earned += state.openRatings[i] || 0;
  });

  app.innerHTML = "";
  const box = document.createElement("div");
  box.className = "results-box";
  let rows = "";
  Object.keys(topics).forEach((t) => {
    rows += '<div class="breakdown-row"><span>' + t + '</span><span>' + topics[t].earned + ' / ' + topics[t].possible + '</span></div>';
  });
  box.innerHTML =
    '<div>סיימתם את ' + exam.title + '</div>' +
    '<div class="big-score">' + earned + ' / ' + possible + '</div>' +
    '<div class="pct">' + pct + '% הצלחה</div>' +
    '<div class="breakdown">' + rows + '</div>';
  app.appendChild(box);

  const restart = document.createElement("button");
  restart.className = "restart-btn";
  restart.textContent = "חזרה לבחירת מבחן";
  restart.onclick = renderSelect;
  const centerWrap = document.createElement("div");
  centerWrap.style.textAlign = "center";
  centerWrap.appendChild(restart);
  app.appendChild(centerWrap);
  window.scrollTo(0, 0);
}

  h.className = "section-title";
  h.textContent = exam.title;

    const card = document.createElement("div");

    if (item.type === "mc") {
      const optWrap = document.createElement("div");
      const letters = ["א", "ב", "ג", "ד"];
      item.options.forEach((opt, oi) => {
        const b = document.createElement("button");
        b.className = "opt";
        b.textContent = letters[oi] + ". " + opt;
        b.onclick = () => {
          if (topicState.mcAnswers[i] !== undefined) return;

          btns.forEach((bb, bi) => {
            bb.classList.add("locked");

          });
          card.querySelector(".explain").style.display = "block";
          updateScorebar();
        };
        optWrap.appendChild(b);
      });

      const revealBtn = document.createElement("button");
      revealBtn.className = "reveal-btn";
      revealBtn.textContent = "בדוק תשובה";

          topicState.fillRatings[i] = val;
          rateRow.querySelectorAll(".rate-btn").forEach((x) => { x.className = "rate-btn"; });

          updateScorebar();

  const finishWrap = document.createElement("div");
  finishWrap.className = "finish-wrap";
  const finishBtn = document.createElement("button");
  finishBtn.className = "finish-btn";
  finishBtn.textContent = "סיים מבחן והצג ציון סופי";
  finishBtn.onclick = () => renderTopicResults(n);
  finishWrap.appendChild(finishBtn);
  app.appendChild(finishWrap);

  updateScorebar();
  window.scrollTo(0, 0);
}

function renderTopicResults(n) {
  const exam = TOPIC_EXAMS[n];
  const { earned, possible } = computeTopicScore(n);
  const pct = Math.round((earned / possible) * 100);

  const topics = {};
  exam.items.forEach((item, i) => {
    const bucket = topicBucket(item.topic);
    topics[bucket] = topics[bucket] || { earned: 0, possible: 0 };
    topics[bucket].possible += 2;
    if (item.type === "mc") {
      if (topicState.mcAnswers[i] === item.correct) topics[bucket].earned += 2;
    } else {
      topics[bucket].earned += topicState.fillRatings[i] || 0;
    }
  });

  app.innerHTML = "";
  const box = document.createElement("div");
  box.className = "results-box";
  let rows = "";
  Object.keys(topics).forEach((t) => {
    rows += '<div class="breakdown-row"><span>' + t + '</span><span>' + topics[t].earned + ' / ' + topics[t].possible + '</span></div>';
  });
  box.innerHTML =
    '<div>סיימתם את ' + exam.title + '</div>' +
    '<div class="big-score">' + earned + ' / ' + possible + '</div>' +
    '<div class="pct">' + pct + '% הצלחה</div>' +
    '<div class="breakdown">' + rows + '</div>';
  app.appendChild(box);

  const restart = document.createElement("button");
  restart.className = "restart-btn";
  restart.textContent = "חזרה לבחירת מבחן";
  restart.onclick = renderSelect;
  const centerWrap = document.createElement("div");
  centerWrap.style.textAlign = "center";
  centerWrap.appendChild(restart);
  app.appendChild(centerWrap);
  window.scrollTo(0, 0);
}

renderSelect();
